<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">BiQuad Monitor — proposed native workspace and compact tuner</title>
  <desc id="description">Original design concept using synthetic measurements. Warm dark surfaces, an orange accent, a sidebar, a measurement strip, two time charts, an inspector, and a separate compact tuner. This is a static review illustration, not the implemented application.</desc>

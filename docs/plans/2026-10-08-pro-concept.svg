      .secondary { fill: #b2aba4; }
      .muted { fill: #938d86; }
      .orange { fill: #ef7a3c; }
      .green { fill: #abc794; }
      .cyan { fill: #8ec9d2; }
      .rule { stroke: #3a3734; stroke-width: 1; }
      .grid { stroke: #302e2b; stroke-width: 1; stroke-dasharray: 3 5; }
      .label { font-size: 12px; letter-spacing: 1px; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
    </style>
  </defs>
